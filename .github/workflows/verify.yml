name: Verify and deploy Nuwa Agent Relay API

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Enforce dependency security (high/critical)
        run: npm run audit:check
      - name: Test Worker and D1
        run: npm test
      - name: Test live smoke harness offline
        run: npm run test:smoke
      - name: Validate deployment configuration script
        run: node --check scripts/prepare-deploy.mjs

  deploy:
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: nuwa-agent-relay-production
      cancel-in-progress: false
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
      MAILTRIGGER_API_URL: ${{ vars.MAILTRIGGER_API_URL }}
      MAILTRIGGER_MANAGED_DOMAIN: ${{ vars.MAILTRIGGER_MANAGED_DOMAIN }}
      MAILTRIGGER_API_TOKEN: ${{ secrets.MAILTRIGGER_API_TOKEN }}
      ALIAS_VERIFICATION_KEY: ${{ secrets.ALIAS_VERIFICATION_KEY }}
      MAILTRIGGER_INBOUND_KEY: ${{ secrets.MAILTRIGGER_INBOUND_KEY }}
      WAKE_ALLOWED_HOSTS: ${{ vars.WAKE_ALLOWED_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate deployment credentials
        shell: bash
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID MAILTRIGGER_MANAGED_DOMAIN MAILTRIGGER_API_TOKEN ALIAS_VERIFICATION_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Cloudflare / MailTrigger configuration: ${name}"
              exit 1
            fi
          done
      - name: Prepare deployment config
        run: node scripts/prepare-deploy.mjs
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.deploy.jsonc
      - name: Deploy Worker
        run: npx wrangler deploy --config .wrangler.deploy.jsonc
      - name: Set MailTrigger Worker secret
        shell: bash
        run: printf '%s' "$MAILTRIGGER_API_TOKEN" | npx wrangler secret put MAILTRIGGER_API_TOKEN --config .wrangler.deploy.jsonc
      - name: Set operator alias-verification Worker secret
        shell: bash
        run: printf '%s' "$ALIAS_VERIFICATION_KEY" | npx wrangler secret put ALIAS_VERIFICATION_KEY --config .wrangler.deploy.jsonc
      - name: Set optional MailTrigger inbound credential
        if: env.MAILTRIGGER_INBOUND_KEY != ''
        shell: bash
        run: printf '%s' "$MAILTRIGGER_INBOUND_KEY" | npx wrangler secret put MAILTRIGGER_INBOUND_KEY --config .wrangler.deploy.jsonc
